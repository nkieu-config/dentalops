services:
  - type: web
    name: dentalops-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm i -g pnpm@10.4.1 && pnpm install --frozen-lockfile && pnpm --filter @dentalops/api exec prisma generate && pnpm --filter @dentalops/api exec prisma migrate deploy && pnpm --filter @dentalops/api db:seed && pnpm turbo run build --filter=@dentalops/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
