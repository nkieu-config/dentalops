name: Refresh visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dentalops
          POSTGRES_PASSWORD: dentalops
          POSTGRES_DB: dentalops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dentalops:dentalops@localhost:5432/dentalops
      DIRECT_URL: postgresql://dentalops:dentalops@localhost:5432/dentalops
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      REDIS_URL: redis://localhost:6379
      MONGODB_URL: mongodb://localhost:27017/dentalops_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:local-workflow
      - run: pnpm --filter @dentalops/api exec prisma generate
      - run: pnpm --filter @dentalops/api exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm --filter @dentalops/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dentalops/web e2e:visual:update
      - name: Commit Linux snapshots to the selected branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots
          git diff --cached --quiet && exit 0
          git commit -m "test(web): refresh visual baselines"
          git push origin "HEAD:${{ github.ref }}"
