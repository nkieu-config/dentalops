services:
  - type: web
    name: dentalops-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health

    # No buildCommand/startCommand: those are for native runtimes only. Render
    # builds the Dockerfile and runs its ENTRYPOINT, which applies
    # `prisma migrate deploy` before exec'ing the server. dockerCommand is
    # deliberately unset so the image's own CMD is used.
    #
    # Migrations run at container start rather than at deploy time because
    # Render's preDeployCommand -- the documented once-per-deploy hook, and the
    # right home for this -- is only available on paid instance types
    # (https://render.com/docs/deploys#pre-deploy-command). On a free instance
    # there is no deploy-time hook at all. `prisma migrate deploy` is idempotent
    # and measured at ~0.4s when there is nothing to apply, which is noise next
    # to a free-tier cold start.
    #
    # If this service moves to a paid instance type, drop RUN_MIGRATIONS and
    # move the work to the real deploy-time hook:
    #   preDeployCommand: apps/api/node_modules/.bin/prisma migrate deploy --schema apps/api/prisma/schema.prisma

    envVars:
      # The API docs are deliberately public on this deployment: it is a
      # portfolio piece and the surface is meant to be readable. Without this
      # the docs are served only outside production.
      - key: EXPOSE_API_DOCS
        value: "true"

      - key: RUN_MIGRATIONS
        value: "true"

      # Seeding is NOT a per-deploy step. The demo seed deletes and recreates
      # the demo tenant, so running it on every container start would discard
      # whatever a visitor had just done. The entrypoint seeds only when this is
      # "true" AND the demo tenant is absent, making it a one-time bootstrap for
      # an empty database. To refresh demo data on a live service, use the app's
      # own DemoResetService rather than a deploy.
      - key: RUN_DEMO_SEED
        value: "true"

      - key: WEB_ORIGIN
        sync: false
      # Neon gives two hostnames for the same database. DATABASE_URL takes the
      # one containing "-pooler"; DIRECT_URL takes the one without it. Setting
      # both to the pooler makes `prisma migrate deploy` run through PgBouncer,
      # which cannot hold the advisory locks a migration takes. The API warns at
      # startup if this pair looks wrong.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
